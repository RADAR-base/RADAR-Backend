plugins {
    // Apply the java plugin to add support for Java
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
}

//---------------------------------------------------------------------------//
// Configuration                                                             //
//---------------------------------------------------------------------------//

group = 'org.radarcns'
version = '0.4.0'

mainClassName = 'org.radarcns.RadarBackend'
applicationDefaultJvmArgs = ["-Dlog4j.configuration=log4j.properties"]


targetCompatibility = '17'
sourceCompatibility = '17'

ext {
    moduleDescription = 'Kafka backend for processing device data.'
    githubRepoName = 'RADAR-Base/RADAR-Backend'


    githubUrl = 'https://github.com/' + githubRepoName + '.git'
    issueUrl = 'https://github.com/' + githubRepoName + '/issues'
    website = 'http://radar-base.org'

//    codacyVersion = '4.0.2'
    confluentVersion = '8.1.1'
    hamcrestVersion = '1.3'
    kafkaVersion = '3.6.1'
    jacksonVersion = '2.21'
    javaMailVersion = '2.1.5'
    junitVersion = '4.12'
    findbugVersion = '3.0.2'
    commonsCliVersion = '1.11.0'
    mockitoVersion = '5.21.0'
    radarCommonsVersion = '1.2.4'
    radarSchemasVersion = '0.8.15'
    subethamailVersion = '3.1.7'
    jsoupVersion = '1.11.3'
    slf4jVersion = '1.7.25'
    log4jVersion = '1.2.17'
    avroVersion = '1.12.1'
    kotlinVersion = '1.9.24'
}

//---------------------------------------------------------------------------//
// Sources and classpath configurations                                        //
//---------------------------------------------------------------------------//

// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
    // Kafka/confluent releases
    maven { url 'https://packages.confluent.io/maven/' }
    // For working with dev-branches (if really needed); prefer HTTPS
    maven { url 'https://oss.jfrog.org/artifactory/oss-snapshot-local/' }
    // Github code
    maven { url 'https://jitpack.io' }
    // RADAR-Base releases
    maven { url 'https://repo1.maven.org/maven2/' }
}

// In this section you declare the dependencies for your production and test code
dependencies {
    implementation(libs.radar.commons)
    implementation(libs.radar.commons.server)
    implementation(libs.avro)
    implementation(libs.radar.commons.testing)
    implementation(libs.radar.schemas.commons)

    implementation(libs.kotlin.stdlib)

    implementation(libs.kafka.streams)
    implementation(libs.kafka.streams.avro.serde) {
        exclude(group: 'org.slf4j', module: 'slf4j-log4j12')
        exclude(group: 'log4j', module: 'log4j')
        exclude(group: 'jline', module: 'jline')
        exclude(group: 'io.netty', module: 'netty')
    }

    implementation(libs.jsr305)
    implementation(libs.commons.cli)
    implementation(libs.jackson.annotations)
    implementation(libs.jakarta.mail)
    implementation(libs.jsoup)

    runtimeOnly(libs.log4j)
    runtimeOnly(libs.slf4j.log4j)

    // Testing
    testImplementation(libs.junit)
    testImplementation(libs.mockito.core)
    testImplementation(libs.hamcrest.all)

    // Mock mail server
    testImplementation(libs.greenmail)

    // Using the bundle for Logging
    testImplementation(libs.bundles.logging.log4j)
}

tasks.withType(ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

if (!hasProperty('profile')) {
    ext.profile = 'dev'
}

apply from: "gradle/profile.${profile}.gradle"

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
